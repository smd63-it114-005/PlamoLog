<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlamoLog - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Plamo<span>Log</span></a>
        <div class="nav-links">
            <a href="index.html">Catalog</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <div class="auth-container">
        <h2>Login to PlamoLog</h2>
        <form class="auth-form" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="builder@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder=".........." required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>
    </div>

    <script>
        const loginForm = document.querySelector('.auth-form');
        const msgBox = document.createElement('p');
        msgBox.style.marginTop = '1rem';
        msgBox.style.textAlign = 'center';
        msgBox.style.fontWeight = '600';
        loginForm.appendChild(msgBox);

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgBox.style.color = '#38bdf8';
            msgBox.textContent = 'Signing in...';

            const email = loginForm.querySelector('input[type="email"]').value.trim();
            const password = loginForm.querySelector('input[type="password"]').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('plamolog_token', data.token);
                    msgBox.style.color = '#10b981';
                    msgBox.textContent = `Welcome back, ${data.user.username}! Redirecting to catalog...`;
                    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
                } else {
                    msgBox.style.color = '#f97316';
                    msgBox.textContent = data.error || 'Invalid email or password.';
                }
            } catch (err) {
                msgBox.style.color = '#ef4444';
                msgBox.textContent = 'Could not reach backend API.';
            }
        });
    </script>
</body>
</html>
